<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Create and share tier lists for free with Tier Online.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Tier Online | Create and Share Tier Lists">
  <meta property="og:description" content="Create and share tier lists for free with Tier Online.">
  <meta name="theme-color" content="#0D0D0F">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tier Online">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Tier Online | Create and Share Tier Lists</title>
  <link rel="manifest" href="manifest.json">
  <script>
    (() => {
      const pathLocale = ['ja', 'ko', 'en'].includes(location.pathname.split('/')[1])
        ? location.pathname.split('/')[1]
        : null;
      const browserLocale = navigator.language || 'ja-JP';
      const localeParts = browserLocale.replace('_', '-').split('-');
      const language = localeParts[0].toLowerCase();
      const region = (localeParts[1] || '').toUpperCase();
      const detectedLocale = region === 'KR' || language === 'ko'
        ? 'ko'
        : region === 'JP' || language === 'ja'
          ? 'ja'
          : 'en';
      const locale = pathLocale || detectedLocale;
      const meta = {
        ja: {
          title: 'tier表オンライン｜無料でTier表を作成・共有',
          description: '無料でTier表を作成・共有。みんなのランキングと自分の結果を比べよう。',
          ogLocale: 'ja_JP'
        },
        ko: {
          title: '티어표 온라인 | 무료 티어표 만들기',
          description: '무료로 티어표를 만들고 공유하고, 모두의 랭킹과 비교해 보세요.',
          ogLocale: 'ko_KR'
        },
        en: {
          title: 'Tier Online | Create and Share Tier Lists',
          description: 'Create and share tier lists for free, then compare your ranking with the community.',
          ogLocale: 'en_US'
        }
      }[locale];
      document.documentElement.lang = locale;
      document.title = meta.title;
      document.querySelector('meta[name="description"]').content = meta.description;
      document.querySelector('meta[property="og:title"]').content = meta.title;
      document.querySelector('meta[property="og:description"]').content = meta.description;
      const ogLocale = document.createElement('meta');
      ogLocale.property = 'og:locale';
      ogLocale.content = meta.ogLocale;
      document.head.appendChild(ogLocale);
      if (/^\/(ja|ko|en)\/?$/.test(location.pathname)) {
        for (const code of ['ja', 'ko', 'en']) {
          const link = document.createElement('link');
          link.rel = 'alternate';
          link.hreflang = code;
          link.href = `${location.origin}/${code}/`;
          document.head.appendChild(link);
        }
        const fallback = document.createElement('link');
        fallback.rel = 'alternate';
        fallback.hreflang = 'x-default';
        fallback.href = `${location.origin}/ja/`;
        document.head.appendChild(fallback);
      }
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
