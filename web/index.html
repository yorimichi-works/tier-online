  <title>tier表オンライン｜無料でTier表を作成・共有</title>
  <link rel="manifest" href="manifest.json">
  <script async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3186852093801241"
    crossorigin="anonymous"></script>
  <script>
    (() => {
      // Flutter起動前にも言語を確定する必要があるため、Dartの
      // InternationalizationConfigと同じcanonical codeだけをここに保持する。
      const supportedLocales = Object.freeze(['ja', 'ko', 'en', 'zh-tw', 'pt-br']);
      const hreflangByLocale = Object.freeze({
        ja: 'ja', ko: 'ko', en: 'en', 'zh-tw': 'zh-Hant-TW', 'pt-br': 'pt-BR'
      });
      const pathSegment = location.pathname.split('/')[1];
      const pathLocale = supportedLocales.includes(pathSegment)
        ? pathSegment
        : null;
      const browserLocale = navigator.language || 'ja-JP';
      const localeParts = browserLocale.replace('_', '-').split('-');
      const language = localeParts[0].toLowerCase();
      const region = localeParts.map((part) => part.toUpperCase()).find(
        (part) => ['JP', 'KR', 'TW', 'HK', 'BR'].includes(part)
      ) || '';
      const traditionalChinese = localeParts.some((part) => part.toLowerCase() === 'hant');
      const detectedLocale = region === 'KR' || language === 'ko'
        ? 'ko'
        : region === 'JP' || language === 'ja'
          ? 'ja'
          : region === 'TW' || region === 'HK' || (language === 'zh' && traditionalChinese)
            ? 'zh-tw'
            : region === 'BR' || language === 'pt'
              ? 'pt-br'
              : 'en';
      const locale = pathLocale || detectedLocale;
      const meta = {
        ja: {
          title: 'tier表オンライン｜無料でTier表を作成・共有',
          description: '無料でTier表を作成・共有。みんなのランキングと自分の結果を比べよう。',
          ogLocale: 'ja_JP',
          image: '/og-image-ja.png'
        },
        ko: {
          title: '티어표 온라인 | 무료 티어표 만들기',
          description: '무료로 티어표를 만들고 공유하고, 모두의 랭킹과 비교해 보세요.',
          ogLocale: 'ko_KR',
          image: '/og-image-ko.png'
        },
        'zh-tw': {
          title: 'Tier 表線上版｜免費建立與分享 Tier 排名',
          description: '免費建立並分享 Tier 排名表，和大家的排名結果互相比較。',
          ogLocale: 'zh_TW',
          image: '/icons/Icon-512.png'
        },
        'pt-br': {
          title: 'Tier Online | Crie e compartilhe Tier Lists',
          description: 'Crie e compartilhe Tier Lists gratuitamente e compare seu ranking com a comunidade.',
          ogLocale: 'pt_BR',
          image: '/og-image-en.png'
        },
        en: {
          title: 'Tier Online | Create and Share Tier Lists',
          description: 'Create and share tier lists for free, then compare your ranking with the community.',
          ogLocale: 'en_US',
          image: '/og-image-en.png'
        }
      }[locale];
      document.documentElement.lang = locale === 'zh-tw'
        ? 'zh-TW'
        : locale === 'pt-br'
          ? 'pt-BR'
          : locale;
      document.title = meta.title;
      document.querySelector('meta[name="description"]').content = meta.description;
      document.querySelector('meta[property="og:title"]').content = meta.title;
      document.querySelector('meta[property="og:description"]').content = meta.description;
      document.querySelector('meta[property="og:image"]').content = `${location.origin}${meta.image}`;
      const ogLocale = document.createElement('meta');
      ogLocale.property = 'og:locale';
      ogLocale.content = meta.ogLocale;
      document.head.appendChild(ogLocale);
      if (pathLocale && location.pathname.split('/').filter(Boolean).length === 1) {
        for (const code of supportedLocales) {
          const link = document.createElement('link');
          link.rel = 'alternate';
          link.hreflang = hreflangByLocale[code];
          link.href = `${location.origin}/${code}/`;
          document.head.appendChild(link);
        }
        const fallback = document.createElement('link');
        fallback.rel = 'alternate';
        fallback.hreflang = 'x-default';
        fallback.href = `${location.origin}/ja/`;
        document.head.appendChild(fallback);
      }
    })();
  </script>

<body>
  <div id="app-loading" role="status" aria-live="polite">
    <div class="app-loading-content">
      <div class="app-loading-mark" aria-hidden="true"></div>
      <div class="app-loading-label" id="app-loading-label">Tier Online</div>
    </div>
  </div>
  <script>
    (() => {
      const locale = document.documentElement.lang;
      const label = document.getElementById('app-loading-label');
      label.textContent = locale === 'ko'
        ? '티어표 온라인'
        : locale === 'ja'
          ? 'tier表オンライン'
          : locale.toLowerCase() === 'zh-tw'
            ? 'Tier 表線上版'
          : 'Tier Online';
      window.addEventListener('flutter-first-frame', () => {
        // CanvasKit can complete its first frame just before its bundled
        // fallback fonts are attached to the paragraph renderer. Keep the
        // loading cover for a short stabilization window so that transient
        // missing-glyph boxes are never exposed.
        window.setTimeout(() => {
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              document.getElementById('app-loading')?.setAttribute('hidden', '');
            });
          });
        }, 250);
      }, { once: true });
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Run outside Flutter's cached bootstrap so even visitors controlled by
    // an older Flutter service worker can move to the latest production UI.
    (async () => {
      if ('serviceWorker' in navigator) {
        try {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(
            registrations.map((registration) => registration.unregister()),
          );
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(
              keys
                .filter((key) => key.startsWith('flutter-app-cache'))
                .map((key) => caches.delete(key)),
            );
          }
        } catch (_) {
          // Always continue to Flutter, even when browser storage is blocked.
        }
      }
      const bootstrap = document.createElement('script');
      bootstrap.src = `flutter_bootstrap.js?v=${Date.now()}`;
      bootstrap.async = true;
      document.body.appendChild(bootstrap);
    })();
  </script>
