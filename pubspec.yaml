name: tier_table_online
description: "みんなで決める、みんなのTier。"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_picker: ^12.0.0
  image: ^4.9.2
  shared_preferences: ^2.5.5
  firebase_core: ^4.14.0
  firebase_app_check: ^0.4.7
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.5.0
  desktop_drop: ^0.8.2
  cloud_functions: ^6.4.0
  url_launcher: ^6.3.2
  google_sign_in: ^6.3.0
  google_mobile_ads: ^5.3.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: TierNotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-TierSubset.ttf
          weight: 500
    - family: TierNotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR-TierSubset.ttf
          weight: 500
  assets:
    - assets/branding/tier-logo.png
    - assets/branding/tier-logo-ko.png
    - assets/branding/tier-logo-en.png
    - assets/starter_tiers/items/pasta/
    - assets/starter_tiers/items/breakfast/
    - assets/starter_tiers/items/pizza/
    - assets/starter_tiers/items/sweets/
    - assets/starter_tiers/items/ramen/
    - assets/starter_tiers/items/coffee/
    - assets/starter_tiers/items/curry/
    - assets/starter_tiers/items/bread/
    - assets/starter_tiers/items/fruit/
    - assets/starter_tiers/items/landscapes/
    - assets/fonts/OFL.txt
